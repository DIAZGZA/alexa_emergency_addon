name: "Alexa Emergency System"
version: "1.0.0"
slug: "alexa_emergency"
description: "Asistente de seguridad que detecta caídas y alertas usando el micrófono"
url: "https://github.com/DIAZGZA/alexa_emergency_addon"
arch:
  - amd64
  - armv7
  - aarch64
init: false
ingress: true
ingress_port: 3000
webui: true
homeassistant_api: true
audio: true
startup: "services"
options:
  NOTIFIER_PROVIDER: "local"
schema:
  NOTIFIER_PROVIDER: "list(local|telegram)?"
  TELEGRAM_BOT_TOKEN: "str?"
  TELEGRAM_BOT_USERNAME: "str?"
  TELEGRAM_WEBHOOK_SECRET: "str?"
  GROQ_API_KEY: "str?"
  ANTHROPIC_API_KEY: "str?"
