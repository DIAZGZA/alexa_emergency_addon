name: "Alexa Emergency System"
version: "1.1.2"
slug: "alexa_emergency"
description: "Asistente de seguridad que detecta caídas y alertas usando el micrófono"
url: "https://github.com/DIAZGZA/alexa_emergency_addon"
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 3000
homeassistant_api: true
audio: true
startup: "services"
options:
  STT_PROVIDER: "groq"
  CLASSIFIER_PROVIDER: "anthropic"
  NOTIFIER_PROVIDER: "telegram"
  STORE_PROVIDER: "memory"
schema:
  STT_PROVIDER: "str?"
  CLASSIFIER_PROVIDER: "str?"
  ANTHROPIC_API_KEY: "str?"
  GROQ_API_KEY: "str?"
  NOTIFIER_PROVIDER: "str?"
  TELEGRAM_BOT_TOKEN: "str?"
  TELEGRAM_BOT_USERNAME: "str?"
  TELEGRAM_WEBHOOK_SECRET: "str?"
  APP_BASE_URL: "str?"
  AWS_REGION: "str?"
  AWS_SNS_TOPIC_ARN: "str?"
  AWS_ACCESS_KEY_ID: "str?"
  AWS_SECRET_ACCESS_KEY: "str?"
  STORE_PROVIDER: "str?"
  SUPABASE_URL: "str?"
  SUPABASE_SERVICE_ROLE_KEY: "str?"
  ACK_TOKEN_SECRET: "str?"
  CRON_SECRET: "str?"
